name: Docs Checks

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run markdown lint
        run: npx --yes markdownlint-cli2 "**/*.md"
