name: PR Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'backend/pyproject.toml'
              - 'eval/**'
              - 'docker-compose.yml'
              - '.github/workflows/release-readiness.yml'
            frontend:
              - 'frontend/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'backend/api/main.py'
              - 'frontend/src/api/client.ts'
            docs:
              - '*.md'
              - 'docs/**'

  backend-unit:
    name: Backend unit tests
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Run backend unit tests
        working-directory: backend
        run: uv run pytest tests/unit -q

  backend-integration:
    name: Backend integration tests
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.backend == 'true' }}
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Wait for Qdrant
        run: |
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:6333/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant did not become ready in time." >&2
          exit 1
      - name: Run backend integration tests
        working-directory: backend
        env:
          QDRANT_URL: http://127.0.0.1:6333
        run: uv run pytest tests/integration -m integration -q

  frontend-verify:
    name: Frontend tests and build
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Run frontend build
        working-directory: frontend
        run: npm run build

  ci-summary:
    name: CI summary
    needs:
      - changes
      - backend-unit
      - backend-integration
      - frontend-verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize run
        run: |
          backend_changed="${{ needs.changes.outputs.backend }}"
          frontend_changed="${{ needs.changes.outputs.frontend }}"
          backend_unit="${{ needs.backend-unit.result }}"
          backend_integration="${{ needs.backend-integration.result }}"
          frontend_verify="${{ needs.frontend-verify.result }}"

          echo "## PR CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "|Tier|Run reason|Result|" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          if [ "$backend_changed" = "true" ]; then
            echo "|backend-unit|Backend files changed|$backend_unit|" >> "$GITHUB_STEP_SUMMARY"
            echo "|backend-integration|Backend files changed|$backend_integration|" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "|backend-unit|No backend path changes|skipped|" >> "$GITHUB_STEP_SUMMARY"
            echo "|backend-integration|No backend path changes|skipped|" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$frontend_changed" = "true" ]; then
            echo "|frontend-verify|Frontend files changed|$frontend_verify|" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "|frontend-verify|No frontend path changes|skipped|" >> "$GITHUB_STEP_SUMMARY"
          fi

          fail=0
          if [ "$backend_changed" = "true" ] && [ "$backend_unit" != "success" ]; then
            fail=1
          fi
          if [ "$backend_changed" = "true" ] && [ "$backend_integration" != "success" ]; then
            fail=1
          fi
          if [ "$frontend_changed" = "true" ] && [ "$frontend_verify" != "success" ]; then
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Required job failed or did not complete." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
