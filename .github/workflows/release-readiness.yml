name: Release Readiness

on:
  workflow_dispatch:
    inputs:
      run_live_tests:
        description: Run optional live model/integration tests
        type: boolean
        default: false
      run_frontend_build:
        description: Run optional full frontend build
        type: boolean
        default: false

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Run backend unit tests
        working-directory: backend
        run: uv run pytest tests/unit -q

  backend-integration:
    name: Backend integration tests
    needs: backend-unit
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Wait for Qdrant
        run: |
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:6333/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant did not become ready in time." >&2
          exit 1
      - name: Run backend integration tests
        working-directory: backend
        env:
          QDRANT_URL: http://127.0.0.1:6333
        run: uv run pytest tests/integration -m integration -q

  backend-live:
    name: Optional live tests
    needs: backend-integration
    if: ${{ inputs.run_live_tests }}
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST || 'http://127.0.0.1:3000' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Wait for Qdrant
        run: |
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:6333/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant did not become ready in time." >&2
          exit 1
      - name: Run live tests
        working-directory: backend
        env:
          QDRANT_URL: http://127.0.0.1:6333
        run: uv run pytest tests/live -m live -q

  frontend-build:
    name: Optional frontend build
    if: ${{ inputs.run_frontend_build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend build
        working-directory: frontend
        run: npm run build

  readiness-summary:
    name: Release readiness summary
    if: always()
    needs:
      - backend-unit
      - backend-integration
      - backend-live
      - frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: Publish summary
        run: |
          echo "## Release Readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "|Job|Result|" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "|backend-unit|${{ needs.backend-unit.result }}|" >> "$GITHUB_STEP_SUMMARY"
          echo "|backend-integration|${{ needs.backend-integration.result }}|" >> "$GITHUB_STEP_SUMMARY"
          echo "|backend-live|${{ needs.backend-live.result }}|" >> "$GITHUB_STEP_SUMMARY"
          echo "|frontend-build|${{ needs.frontend-build.result }}|" >> "$GITHUB_STEP_SUMMARY"
